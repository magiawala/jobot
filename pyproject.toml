[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobbot"
version = "0.1.0"
description = "Local automated job application pipeline"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
jobbot = "jobbot.cli:app"

[tool.setuptools]
packages = ["jobbot", "jobbot.discover", "jobbot.resume", "jobbot.apply", "jobbot.ingest", "jobbot.outcomes", "jobbot.scheduler"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
