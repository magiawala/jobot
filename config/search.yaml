roles:
  product_design:
    titles_exact: ["Product Designer", "Senior Product Designer", "Product Design Lead"]
    titles_related: ["Interaction Designer", "Digital Product Designer", "Product Designer II", "Designer, Product"]
  design_engineer:
    titles_exact: ["Design Engineer", "UX Engineer", "Design Technologist"]
    titles_related: ["Frontend Engineer, Design Systems", "Creative Technologist", "UI Engineer", "Design Systems Engineer", "Front End Engineer, Design"]
  ux_design:
    titles_exact: ["UX Designer", "UX/UI Designer", "User Experience Designer"]
    titles_related: ["UI Designer", "Experience Designer", "UI/UX Designer", "Product Designer, UX"]

title_blocklist: ["Intern", "Graphic Designer", "Instructional Designer", "Interior", "Fashion",
                  "Mechanical", "Electrical", "Hardware", "Civil", "Structural", "Industrial Designer",
                  "Sound Designer", "Game Designer", "Level Designer", "Learning Designer",
                  "Motion Designer", "Brand Designer", "Visual Designer", "Marketing Designer",
                  "Design Manager", "Design Director", "Design Researcher", "Content Designer",
                  "Optical", "Chip", "ASIC", "RTL", "Analog", "Verification", "Design Project Manager",
                  "Production Designer", "Production Design", "FPGA", "PCB", "RF Design", "RF Engineer",
                  "Firmware", "Circuit", "Semiconductor", "Antenna", "Silicon", "Wire Harness", "Harness",
                  "Set Designer", "Costume Designer", "Landscape Designer", "Floral Designer", "Jewelry Designer",
                  # hardware/EE roles that still scored 50-80 because "Design Engineer" is their job title too
                  "PLL", "SoC", "VLSI", "CMOS", "Photonic", "Thermal", "Layout Engineer", "Packaging",
                  "Validation Engineer", "Signal Integrity", "Power Supply", "Mixed-Signal", "Mixed Signal",
                  "Embedded", "Wafer", "Lithography", "Optical Engineer", "Mechanical Engineer",
                  # "Physical Design" is chip floorplanning/layout, not product design
                  "Physical Design", "Design Verification", "Place and Route", "Timing Closure",
                  # retail/merchandise design - big Workday employers like Target post these as
                  # "Product Designer", but they design physical goods, not software
                  "Apparel", "Softlines", "Hardlines", "Textile", "Sweaters", "Wovens", "Knits",
                  "Home Decor", "Home Decorative", "Lighting", "Footwear", "Accessories Designer",
                  "3D Designer", "CAD Designer", "Packaging Designer", "Print Designer",
                  "Technical Designer", "Merchandise", "Trim Designer", "Colorist",
                  # support roles that carry "Design" in the title
                  "Executive Assistant", "Design Advocate", "Designer Advocate",
                  "Recruiter", "Coordinator", "Design Program",
                  # more hardware/industrial titles that read as design roles
                  "Package Designer", "Core Design", "Reactor", "Nuclear", "Turbine",
                  "Structural Designer", "Piping", "HVAC", "Tooling", "Die Design", "Mold"]

# Companies to skip entirely. Excluded 2026-09-23 at Devanshu's request: defense and
# space/aerospace primes gate on US-person status, security-clearance eligibility and ITAR/EAR
# export controls. Needing future sponsorship makes those roles effectively unreachable, so
# applying spends slots (and forces citizenship questions JobBot must not answer) for nothing.
# Matched case-insensitively as a substring of the company name.
company_blocklist: ["Anduril", "Chariot Defense", "Second Front", "Neros Technologies", "Skydio",
                    "Primer", "Stoke Space", "Lockheed", "Raytheon", "Northrop", "General Dynamics",
                    "L3Harris", "Leidos", "Booz Allen", "SAIC", "MITRE", "Shield AI", "Epirus",
                    "Castelion", "Firestorm", "Hadrian", "True Anomaly", "X-Bow", "Ursa Major",
                    "Vannevar", "Govini", "Rebellion Defense", "Astranis"]

seniority:
  target: mid
  allowed_title_words: []            # plain titles, e.g. "Product Designer", count as mid
  soft_title_words: ["Senior", "Sr", "Sr."]   # allowed but scored lower; set to [] to skip Senior roles
  blocked_title_words: ["Intern", "Internship", "Junior", "Jr", "Jr.", "Entry", "Associate", "Apprentice",
                        "Staff", "Principal", "Lead", "Head of", "Manager", "Director", "VP",
                        "Vice President", "Chief", "Founding", "Fellow", "New Grad", "Graduate"]
  years_required: { min_ok: 2, max_ok: 6 }   # "0-1 years" or "8+ years" fail the gate

salary:
  currency: USD
  target_min: 130000
  target_max: 200000
  hourly_to_annual_hours: 2080
  if_unlisted: allow_with_penalty    # allow_with_penalty | skip
  unlisted_penalty: 10

locations:
  country: US                 # hard requirement, US only
  remote_us_ok: true          # remote roles count only if open to US-based candidates
  cities: []                  # optional preferred US cities (bonus points, not a filter)
  # Skip: non-US locations, "remote" limited to other countries/regions (e.g. "Remote - EMEA",
  # "Remote (Canada)", "UK only"), and postings requiring residence outside the US.

thresholds: { skip_below: 50, tailor_at_or_above: 75 }

# Raised to 40/day 2026-09-27 to clear the revived backlog faster.
#
# Claude calls are no longer the constraint they looked like. Measured over four days, drafting
# costs ~0.5-1 call per application rather than the 1-2 assumed: the 57 learned answers resolve
# most questions without a call, and form_limits skips the multi-essay forms that were the
# expensive ones. 09-25 ran ~20 applications on 11 calls. 60 leaves real headroom at 40/day.
#
# If you start hitting Pro usage limits, lower max_claude_calls_per_day first - applications
# still go out, they just fall back to needs_human on essay questions instead of drafting.
limits: { max_tailors_per_day: 10, max_apps_per_run: 10, max_apps_per_day: 40, max_claude_calls_per_day: 60 }
weekly_application_target: 100

# ATSs whose forms JobBot can actually submit. Measured, not assumed: Ashby accounts for every
# confirmed submission, while Greenhouse boards using reCAPTCHA Enterprise cannot be submitted
# at all and Workday needs an account per company. Jobs on the others stay in the pool and are
# worked by `jobbot handoff`; they just don't consume the automated run's limited slots, which
# was costing half of every batch.
automatable_ats: ["ashby", "lever"]

# Long applications aren't worth the slot. Measured across 184 real applications: forms with
# 11+ fields completed at 19% vs 36% for 1-6, and Devanshu's experience is that the long ones
# don't produce callbacks regardless. Checked before filling, so an abandoned form never spends
# Claude calls drafting its essays.
form_limits:
  enabled: true
  max_fields: 14              # radio/checkbox groups count as one question, not one per option
  max_essay_questions: 3      # free-text boxes needing a drafted answer
  always_apply_ats: ["workday"]   # exempt whatever the length - these convert
# AUTO enabled 2026-09-23 at Devanshu's request. Submits automatically when a form fills
# completely with no unanswered required questions. Dream companies (Figma, Linear, Notion)
# still wait for review - you get one shot at those. Switch back to REVIEW any time.
mode: AUTO          # DRY_RUN | REVIEW | AUTO
report_time: "20:00"
tailor_batch_hours: [9, 13, 17]
no_response_days: 21
